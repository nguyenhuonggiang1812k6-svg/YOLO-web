services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yolo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=${MODEL_NAME:-yolov8n.pt}
      - CONFIDENCE_DEFAULT=${CONFIDENCE_DEFAULT:-0.25}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-25}
    networks:
      - yolo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yolo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - yolo-net

networks:
  yolo-net:
    driver: bridge
